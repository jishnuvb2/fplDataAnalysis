name: Daily Pure FPL Data Fetch

on:
  schedule:
    # Runs every single day at 4:15 AM UTC (15 minutes after your other script)
    - cron: '15 4 * * *'
  workflow_dispatch: # Adds the manual "Run now" button on GitHub

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
    # 1. Download your repo's files onto GitHub's cloud computer
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up Python on GitHub's cloud computer
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Install required packages
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas understatapi aiohttp

    # 4. Run your alternative python file
    - name: Run Fetch Script
      run: python pureFPLDataFetch.py

    # 5. Push the newly updated pure FPL CSVs back to your repo
    - name: Commit and Push CSV changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add pure_fpl_teams.csv pure_fpl_players.csv
        git diff-index --quiet HEAD || (git commit -m "Automated daily Pure FPL data update" && git push)
