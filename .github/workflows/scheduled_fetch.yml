name: Daily FPL Data Fetch

on:
  schedule:
    # This tells GitHub to run your script every single day at 4:00 AM UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # This adds a manual "Run now" button on GitHub for testing

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
    # 1. Download your repo's files onto GitHub's cloud computer
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up Python on GitHub's cloud computer
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Install the exact packages your dataFetch.py script needs to run
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas understat

    # 4. Run your python file just like you do on your own machine
    - name: Run Fetch Script
      run: python dataFetch.py

    # 5. Push the newly updated teams.csv and players.csv back to your repo
    - name: Commit and Push CSV changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add teams.csv players.csv
        git diff-index --quiet HEAD || (git commit -m "Automated daily FPL/Understat data update" && git push)
